<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Haii, aku Aiss! - Mahasiswa Teknologi Informasi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B3E5FC"/>
      <stop offset="35%" stop-color="#Bfbaf5"/>
      <stop offset="70%" stop-color="#FAAFF5"/>
      <stop offset="100%" stop-color="#F2FABE"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8B7FD6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>

  <!-- Border -->
  <rect x="6" y="6" width="1188" height="268" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="2"/>

  <!-- Title -->
  <text x="600" y="140" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="64" font-weight="700" fill="#2A2350">Haii, aku Aiss! <tspan fill="#B45309">✦</tspan></text>

  <!-- Divider + Subtitle -->
  <line x1="330" y1="190" x2="450" y2="190" stroke="#8B7FD6" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="750" y1="190" x2="870" y2="190" stroke="#8B7FD6" stroke-width="2" stroke-opacity="0.7"/>
  <text x="600" y="197" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="22" font-weight="600" letter-spacing="8" fill="#4B3F72">MAHASISWA TEKNOLOGI INFORMASI</text>
</svg>
