<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Haii, aku Aiss! - Mahasiswa Teknologi Informasi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060D1F"/>
      <stop offset="55%" stop-color="#0B1B3A"/>
      <stop offset="100%" stop-color="#0F2E6B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>

  <!-- Border -->
  <rect x="6" y="6" width="1188" height="268" rx="14" fill="none" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Title -->
  <text x="600" y="140" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="64" font-weight="700" fill="#FFFFFF">Haii, aku Aiss! <tspan fill="#FBBF24">✦</tspan></text>

  <!-- Divider + Subtitle -->
  <line x1="330" y1="190" x2="450" y2="190" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="750" y1="190" x2="870" y2="190" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.8"/>
  <text x="600" y="197" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="22" font-weight="600" letter-spacing="8" fill="#7DD3FC">MAHASISWA TEKNOLOGI INFORMASI</text>
</svg>
